name: quizaipro_mobile
description: QuizAIPro — AI-powered flashcard learning application
publish_to: none
version: 1.0.0+19

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management / DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.6.0

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^7.0.0

  # Local storage — relational (SQLite)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Local storage — key-value
  hive_flutter: ^1.1.0

  # Secrets (Keychain / Keystore)
  flutter_secure_storage: ^9.2.2

  # Firebase
  firebase_core: ^3.3.0
  firebase_crashlytics: ^4.1.0
  firebase_messaging: ^15.1.0
  firebase_analytics: ^11.3.0

  # Immutable models / codegen annotations
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Functional error handling (Either<Failure, T>)
  fpdart: ^1.1.0

  # Social sign-in
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3

  # File picking (PDF upload in AI Studio)
  file_picker: ">=10.0.0 <10.4.0"

  # Fonts via Google Fonts CDN (fallback until bundled fonts are added)
  google_fonts: ^6.2.1

  # Utilities
  package_info_plus: ^9.0.0
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  riverpod_generator: ^2.6.4
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"

  # fonts:
  #   Font files are not yet included in assets/fonts/.
  #   To restore bundled fonts, download from Google Fonts and add:
  #     SpaceGrotesk: Light(300), Regular(400), Medium(500), SemiBold(600), Bold(700)
  #     Inter: Light(300), Regular(400), Medium(500), SemiBold(600), Bold(700)
  #   Then uncomment and add the declarations here.
  #   Until then, google_fonts package is used (see aurora_theme.dart).
