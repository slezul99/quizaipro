# Nixpacks build configuration for Railway.
# Pithon + Node.js for Tailwind CSS build step.

[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "npm install --no-audit --no-fund",
]

[phases.build]
cmds = [
  "npm run build:css",
]

[start]
cmd = "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 600 --graceful-timeout 30"
