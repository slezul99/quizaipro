{% extends "base.html" %}
{% block title %}{{ t('ai_h') }} — {{ t('vp_h') }}{% endblock %}
{% block content %}
<div class="relative max-w-2xl mx-auto px-6 py-12"
  x-data="aiGenProgress()" x-init="init()">
  <div class="deco-blob deco-blob-1" style="top:-50px; right:-100px;"></div>
  <div class="deco-blob deco-blob-3" style="bottom:200px; left:-150px;"></div>

  <div class="relative z-10">

    <!-- ===== WORKING STATE ===== -->
    <template x-if="state.status === 'pending' || state.status === 'running'">
      <div class="text-center">
        <div class="w-28 h-28 mx-auto mb-5 rounded-full overflow-hidden ring-4 ring-indigo-200/40 dark:ring-indigo-700/30 shadow-lg">
          <img src="/static/tutor-avatar.png" alt="AI" class="w-full h-full object-cover animate-bounce">
        </div>
        <h1 class="section-h">{{ t('ai_h') }}</h1>
        <p class="text-slate-600 dark:text-slate-300 mt-2 mb-8">
          {% if job.label %}<span class="font-semibold text-indigo-600 dark:text-indigo-300">{{ job.label[:60] }}</span>{% endif %}
        </p>

        <!-- Progress card -->
        <div class="glass-premium mb-5" style="padding: 2rem;">
          <!-- Progress bar -->
          <div class="flex justify-between mb-2 text-sm">
            <span class="font-bold text-slate-700 dark:text-slate-200">
              {{ t('ai_count_label') }}: <span x-text="state.cards_done">{{ job.cards_done }}</span> / <span x-text="state.cards_total">{{ job.cards_total }}</span>
            </span>
            <span class="font-bold text-indigo-600 dark:text-indigo-300">
              <span x-text="state.progress">{{ job.progress }}</span>%
            </span>
          </div>
          <div class="h-4 bg-slate-200/60 dark:bg-slate-700/40 rounded-full overflow-hidden mb-3">
            <div class="h-full transition-all duration-500 rounded-full"
                 :style="`width: ${state.progress}%; background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899);`"
                 style="width: {{ job.progress }}%; background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899);">
            </div>
          </div>

          <!-- Counters -->
          <div class="grid grid-cols-2 gap-3 mt-4 text-center">
            <div class="bg-indigo-50 dark:bg-indigo-900/30 rounded-xl p-3">
              <div class="text-2xl font-black text-indigo-700 dark:text-indigo-300" x-text="state.cards_done">{{ job.cards_done }}</div>
              <div class="text-[11px] uppercase tracking-wider text-slate-500 dark:text-slate-400 font-bold">Создано карточек</div>
            </div>
            <div class="bg-purple-50 dark:bg-purple-900/30 rounded-xl p-3">
              <div class="text-2xl font-black text-purple-700 dark:text-purple-300" x-text="state.cards_total">{{ job.cards_total }}</div>
              <div class="text-[11px] uppercase tracking-wider text-slate-500 dark:text-slate-400 font-bold">Запрошено</div>
            </div>
          </div>

          <!-- Stage message -->
          <div class="mt-4 p-2 bg-slate-100 dark:bg-slate-800/40 rounded-lg text-xs font-mono text-slate-600 dark:text-slate-300 text-center">
            ⚡ <span x-text="state.stage_msg || '{{ job.stage_msg or 'Подготовка...' }}'">{{ job.stage_msg or 'Подготовка...' }}</span>
          </div>

          <!-- Stages -->
          <div class="mt-5 space-y-2 text-left text-sm">
            <div class="flex items-center gap-2">
              <span class="w-5 h-5 rounded-full bg-emerald-500 flex items-center justify-center text-white text-xs">✓</span>
              <span class="text-slate-700 dark:text-slate-200">Запрос принят</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="w-5 h-5 rounded-full bg-indigo-500 animate-pulse flex items-center justify-center text-white text-xs">⋯</span>
              <span class="text-slate-700 dark:text-slate-200">AI генерирует карточки</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="w-5 h-5 rounded-full bg-slate-300 dark:bg-slate-600 flex items-center justify-center text-white text-xs">·</span>
              <span class="text-slate-700 dark:text-slate-200">Сохранение в колоду</span>
            </div>
          </div>
        </div>

        <!-- Warning -->
        <div class="glass-premium border-2 border-amber-400/60 dark:border-amber-500/40"
          style="background: linear-gradient(135deg, rgba(245,158,11,0.15), rgba(255,255,255,0.6)); padding: 1.25rem;">
          <div class="flex items-start gap-3">
            <span class="text-3xl flex-shrink-0">⚠️</span>
            <div class="text-left">
              <div class="font-bold text-amber-900 dark:text-amber-200 mb-1">Не закрывайте страницу</div>
              <p class="text-sm text-amber-800 dark:text-amber-100">AI генерирует карточки в фоне. Это займёт 10–30 секунд.</p>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ===== DONE STATE ===== -->
    <template x-if="state.status === 'done'">
      <div class="text-center">
        <div class="text-8xl mb-5 animate-bounce">🎉</div>
        <h1 class="section-h text-emerald-600 dark:text-emerald-400">Готово!</h1>
        <p class="text-slate-600 dark:text-slate-300 mt-2 mb-6">
          Создано <span class="font-black text-indigo-600 dark:text-indigo-300" x-text="state.cards_done"></span> карточек
        </p>
        <div class="glass-premium mb-5" style="padding: 2rem;">
          <div class="grid grid-cols-2 gap-3 text-center mb-5">
            <div class="bg-emerald-50 dark:bg-emerald-900/30 rounded-xl p-4">
              <div class="text-3xl font-black text-emerald-700 dark:text-emerald-300" x-text="state.cards_done"></div>
              <div class="text-xs uppercase tracking-wider text-slate-500 font-bold mt-1">Карточек создано</div>
            </div>
            <div class="bg-indigo-50 dark:bg-indigo-900/30 rounded-xl p-4">
              <div class="text-3xl font-black text-indigo-700 dark:text-indigo-300">100%</div>
              <div class="text-xs uppercase tracking-wider text-slate-500 font-bold mt-1">Завершено</div>
            </div>
          </div>
          <a :href="`/deck/${state.result_deck_id}`" class="btn-premium w-full justify-center" style="font-size: 16px; padding: 14px;">
            📚 Открыть колоду →
          </a>
          <a href="/ai" class="btn-premium-ghost w-full justify-center mt-3" style="font-size: 14px; padding: 10px;">
            ✨ Создать ещё
          </a>
        </div>
      </div>
    </template>

    <!-- ===== ERROR STATE ===== -->
    <template x-if="state.status === 'error'">
      <div class="text-center">
        <div class="text-8xl mb-5">😔</div>
        <h1 class="section-h text-red-600 dark:text-red-400">Ошибка генерации</h1>
        <div class="glass-premium border-2 border-red-300/60 dark:border-red-500/40 mt-5 mb-5" style="padding: 1.5rem;">
          <p class="text-red-700 dark:text-red-300 text-sm" x-text="state.error || 'Неизвестная ошибка'"></p>
        </div>
        <a href="/ai" class="btn-premium justify-center" style="font-size: 15px; padding: 12px 28px;">
          ← Попробовать снова
        </a>
      </div>
    </template>

  </div>
</div>

<script>
function aiGenProgress() {
  return {
    jobId: {{ job.id|tojson }},
    state: {
      status: {{ job.status|tojson }},
      progress: {{ job.progress }},
      cards_done: {{ job.cards_done }},
      cards_total: {{ job.cards_total }},
      stage_msg: {{ (job.stage_msg or '')|tojson }},
      result_deck_id: {{ (job.result_deck_id or 'null')|safe }},
      error: {{ (job.error or '')|tojson }},
    },
    _timer: null,

    init() {
      if (this.state.status === 'done') {
        // Already done — redirect immediately
        if (this.state.result_deck_id) {
          window.location.href = '/deck/' + this.state.result_deck_id;
        }
        return;
      }
      if (this.state.status === 'error') return;
      this._poll();
    },

    async _poll() {
      try {
        const r = await fetch(`/api/ai/progress/${this.jobId}/status`);
        if (!r.ok) { this._scheduleNext(); return; }
        const d = await r.json();
        this.state = { ...this.state, ...d };

        if (d.status === 'done') {
          // Auto-redirect after 1.5s
          setTimeout(() => {
            if (d.result_deck_id) window.location.href = '/deck/' + d.result_deck_id;
          }, 1500);
          return;
        }
        if (d.status === 'error') return;
        this._scheduleNext();
      } catch(e) {
        this._scheduleNext();
      }
    },

    _scheduleNext() {
      clearTimeout(this._timer);
      this._timer = setTimeout(() => this._poll(), 1500);
    }
  };
}
</script>
{% endblock %}
