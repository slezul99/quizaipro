<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ t('ai_h') }} — {{ t('vp_h') }}</title>
<link rel="stylesheet" href="{{ asset('tailwind.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  (function(){ if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark'); })();
</script>
<style>
  :root {
    --brand-1:#6366f1; --brand-2:#8b5cf6; --brand-3:#ec4899;
    --brand-grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);
    --brand-grad-tri:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#ec4899 100%);
    --page-bg:#f6f5fb; --surface:#ffffff; --text:#1e293b; --text-2:#334155; --text-muted:#64748b;
    --border:rgba(99,102,241,.10); --shadow-card:0 4px 20px -6px rgba(100,90,180,.12);
    --ease:cubic-bezier(.16,1,.3,1);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { background:var(--page-bg); }
  body {
    font-family:'Inter',sans-serif; background:var(--page-bg); color:var(--text);
    -webkit-font-smoothing:antialiased; min-height:100vh; overflow-x:hidden;
    display:flex; flex-direction:column;
  }

  /* Minimal top strip */
  .prog-top {
    height:64px; display:flex; align-items:center; gap:10px;
    padding:0 22px; flex-shrink:0;
  }
  .logo-tile {
    width:36px; height:36px; border-radius:11px; background:var(--brand-grad-tri);
    display:grid; place-items:center; font-family:'Space Grotesk'; font-size:18px; font-weight:800;
    color:#fff; box-shadow:0 4px 12px -2px rgba(99,102,241,.45);
  }
  .wordmark {
    font-family:'Space Grotesk'; font-size:17px; font-weight:700; letter-spacing:-.03em;
    background:var(--brand-grad-tri); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .theme-btn {
    margin-left:auto; width:40px; height:40px; border-radius:11px;
    border:1.5px solid var(--border); background:var(--surface); color:var(--text-muted);
    display:grid; place-items:center; cursor:pointer;
  }
  .theme-btn .icon-moon { display:none; }
  html.dark .theme-btn .icon-sun { display:none; }
  html.dark .theme-btn .icon-moon { display:block; }

  /* Centered content */
  .prog-wrap {
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:20px 16px 48px;
  }
  .prog-col { width:100%; max-width:560px; text-align:center; }

  .prog-avatar {
    width:104px; height:104px; margin:0 auto 18px; border-radius:50%;
    overflow:hidden; box-shadow:0 12px 32px -8px rgba(99,102,241,.5);
    border:4px solid rgba(99,102,241,.18);
  }
  .prog-avatar img { width:100%; height:100%; object-fit:cover; }
  .prog-h {
    font-family:'Space Grotesk'; font-weight:800; font-size:26px; letter-spacing:-.03em;
    color:var(--text);
  }
  .prog-sub { color:var(--text-muted); margin-top:8px; font-size:14px; }
  .prog-label { color:var(--brand-1); font-weight:700; }

  .prog-card {
    background:var(--surface); border:1px solid var(--border); border-radius:20px;
    box-shadow:var(--shadow-card); padding:28px; margin-top:22px; text-align:left;
  }
  .prog-bar-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; }
  .prog-bar-head .l { font-size:13px; font-weight:700; color:var(--text-2); }
  .prog-bar-head .r { font-size:14px; font-weight:800; color:var(--brand-1); }
  .prog-bar-track { height:14px; background:rgba(99,102,241,.10); border-radius:999px; overflow:hidden; }
  .prog-bar-fill { height:100%; border-radius:999px; background:linear-gradient(90deg,#6366f1,#8b5cf6,#ec4899); transition:width .5s var(--ease); }

  .prog-counters { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px; }
  .prog-counter { border-radius:14px; padding:14px; text-align:center; }
  .prog-counter.a { background:rgba(99,102,241,.09); }
  .prog-counter.b { background:rgba(139,92,246,.10); }
  .prog-counter.ok { background:rgba(16,185,129,.10); }
  .prog-counter .n { font-family:'Space Grotesk'; font-weight:800; font-size:26px; color:var(--brand-1); }
  .prog-counter.b .n { color:var(--brand-2); }
  .prog-counter.ok .n { color:#059669; }
  .prog-counter .c { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-top:4px; }

  .prog-stage {
    margin-top:16px; padding:10px; border-radius:10px; text-align:center;
    background:rgba(99,102,241,.06); font-family:'Space Grotesk'; font-size:12px; color:var(--text-2);
  }
  .prog-steps { margin-top:18px; display:flex; flex-direction:column; gap:10px; }
  .prog-step { display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--text-2); }
  .prog-step .dot { width:20px; height:20px; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:11px; flex-shrink:0; }
  .dot-ok { background:#10b981; }
  .dot-now { background:var(--brand-1); animation:pulse 1.4s infinite; }
  .dot-wait { background:#cbd5e1; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.45;} }

  .prog-warn {
    margin-top:18px; border-radius:16px; padding:16px 18px; text-align:left;
    display:flex; align-items:flex-start; gap:12px;
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1.5px solid rgba(245,158,11,.35);
  }
  .prog-warn .h { font-weight:700; color:#b45309; margin-bottom:3px; }
  .prog-warn .b { font-size:13px; color:#92610a; line-height:1.5; }

  .btn-primary {
    display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
    padding:14px 28px; border-radius:999px; background:var(--brand-grad-tri); color:#fff;
    font-family:'Inter'; font-size:15px; font-weight:700; border:none; cursor:pointer;
    text-decoration:none; box-shadow:0 8px 22px -6px rgba(99,102,241,.5); transition:all .2s var(--ease);
  }
  .btn-primary:hover { transform:translateY(-2px); box-shadow:0 12px 28px -6px rgba(99,102,241,.6); }
  .btn-ghost {
    display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
    padding:11px 24px; border-radius:999px; background:transparent; color:var(--brand-1);
    font-family:'Inter'; font-size:14px; font-weight:700; border:1.5px solid rgba(99,102,241,.25);
    cursor:pointer; text-decoration:none; margin-top:12px; transition:all .18s;
  }
  .btn-ghost:hover { background:rgba(99,102,241,.06); }
  .big-emoji { font-size:76px; margin-bottom:14px; }
  .anim-bounce { animation:bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-12px);} }

  /* Dark theme */
  html.dark { --page-bg:#0f1729; --surface:rgba(30,41,75,.65); --text:#e2e8f0; --text-2:#cbd5e1; --text-muted:#94a3b8; --border:rgba(99,102,241,.18); --shadow-card:0 12px 40px -8px rgba(0,0,0,.5); }
  html.dark body { background:linear-gradient(180deg,#0f1729,#141c38); }
  html.dark .prog-bar-track { background:rgba(99,102,241,.16); }
  html.dark .prog-counter.a { background:rgba(99,102,241,.16); }
  html.dark .prog-counter.b { background:rgba(139,92,246,.18); }
  html.dark .prog-counter.ok { background:rgba(16,185,129,.16); }
  html.dark .prog-stage { background:rgba(99,102,241,.12); }
  html.dark .prog-warn { background:linear-gradient(135deg, rgba(245,158,11,.15), rgba(245,158,11,.05)); border-color:rgba(245,158,11,.3); }
  html.dark .prog-warn .h { color:#fcd34d; }
  html.dark .prog-warn .b { color:#fde68a; }
  html.dark .dot-wait { background:#475569; }
  @media (max-width:560px) { .prog-card { padding:20px; } .prog-h { font-size:22px; } }
</style>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
</head>
<body x-data="aiGenProgress()" x-init="init()">

  <header class="prog-top">
    <div class="logo-tile">Q</div>
    <span class="wordmark">QuizAIPro</span>
    <button class="theme-btn" id="themeToggleBtn" aria-label="Toggle theme">
      <svg class="icon-sun" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="icon-moon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </header>

  <main class="prog-wrap">
    <div class="prog-col">

      <!-- ===== WORKING ===== -->
      <template x-if="state.status === 'pending' || state.status === 'running'">
        <div>
          <div class="prog-avatar"><img src="/static/tutor-avatar.png" alt="AI"></div>
          <h1 class="prog-h">{{ t('ai_h') }}</h1>
          <p class="prog-sub">{% if job.label %}<span class="prog-label">{{ job.label[:60] }}</span>{% endif %}</p>

          <div class="prog-card">
            <div class="prog-bar-head">
              <span class="l">{{ t('ai_count_label') }}: <span x-text="state.cards_done">{{ job.cards_done }}</span> / <span x-text="state.cards_total">{{ job.cards_total }}</span></span>
              <span class="r"><span x-text="state.progress">{{ job.progress }}</span>%</span>
            </div>
            <div class="prog-bar-track">
              <div class="prog-bar-fill" :style="`width:${state.progress}%;`" style="width: {{ job.progress }}%;"></div>
            </div>

            <div class="prog-counters">
              <div class="prog-counter a">
                <div class="n" x-text="state.cards_done">{{ job.cards_done }}</div>
                <div class="c">{{ t('aigen_cards_made') }}</div>
              </div>
              <div class="prog-counter b">
                <div class="n" x-text="state.cards_total">{{ job.cards_total }}</div>
                <div class="c">{{ t('aigen_done_label') }}</div>
              </div>
            </div>

            <div class="prog-stage">⚡ <span x-text="state.stage_msg || '{{ job.stage_msg or t('aigen_status_default') }}'">{{ job.stage_msg or t('aigen_status_default') }}</span></div>

            <div class="prog-steps">
              <div class="prog-step"><span class="dot dot-ok">✓</span><span>{{ t('aigen_step_received') }}</span></div>
              <div class="prog-step"><span class="dot dot-now">⋯</span><span>{{ t('aigen_step_generating') }}</span></div>
              <div class="prog-step"><span class="dot dot-wait">·</span><span>{{ t('aigen_step_saving') }}</span></div>
            </div>
          </div>

          <div class="prog-warn">
            <span style="font-size:26px; line-height:1;">⚠️</span>
            <div>
              <div class="h">{{ t('aigen_warn_title') }}</div>
              <div class="b">{{ t('aigen_warn_body') }}</div>
            </div>
          </div>
        </div>
      </template>

      <!-- ===== DONE ===== -->
      <template x-if="state.status === 'done'">
        <div>
          <div class="big-emoji anim-bounce">🎉</div>
          <h1 class="prog-h" style="color:#059669;">{{ t('aigen_finish_h') }}</h1>
          <p class="prog-sub">{{ t('aigen_finish_summary').replace('{n}', '') }}<span class="prog-label" x-text="state.cards_done"></span></p>
          <div class="prog-card">
            <div class="prog-counters" style="margin-top:0;">
              <div class="prog-counter ok">
                <div class="n" x-text="state.cards_done"></div>
                <div class="c">{{ t('aigen_cards_made') }}</div>
              </div>
              <div class="prog-counter a">
                <div class="n">100%</div>
                <div class="c">{{ t('aigen_done_label') }}</div>
              </div>
            </div>
            <a :href="`/deck/${state.result_deck_id}`" class="btn-primary" style="margin-top:20px;">{{ t('aigen_open_deck') }}</a>
            <a href="{{ url_for('ai_page') }}" class="btn-ghost">{{ t('aigen_create_more') }}</a>
          </div>
        </div>
      </template>

      <!-- ===== ERROR ===== -->
      <template x-if="state.status === 'error'">
        <div>
          <div class="big-emoji">😔</div>
          <h1 class="prog-h" style="color:#dc2626;">{{ t('aigen_error_h') }}</h1>
          <div class="prog-card" style="text-align:center;">
            <p style="color:#ef4444; font-size:14px; font-weight:600;" x-text="state.error || '{{ t('aigen_error_default') }}'"></p>
            <a href="{{ url_for('ai_page') }}" class="btn-primary" style="margin-top:18px;">{{ t('aigen_try_again') }}</a>
          </div>
        </div>
      </template>

    </div>
  </main>

  <script>
    document.getElementById('themeToggleBtn').addEventListener('click', function() {
      var isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    function aiGenProgress() {
      return {
        jobId: {{ job.id|tojson }},
        state: {
          status: {{ job.status|tojson }},
          progress: {{ job.progress }},
          cards_done: {{ job.cards_done }},
          cards_total: {{ job.cards_total }},
          stage_msg: {{ (job.stage_msg or '')|tojson }},
          result_deck_id: {{ (job.result_deck_id or 'null')|safe }},
          error: {{ (job.error or '')|tojson }},
        },
        _timer: null,
        init() {
          if (this.state.status === 'done') {
            if (this.state.result_deck_id) window.location.href = '/deck/' + this.state.result_deck_id;
            return;
          }
          if (this.state.status === 'error') return;
          this._poll();
        },
        async _poll() {
          try {
            const r = await fetch(`/api/ai/progress/${this.jobId}/status`);
            if (!r.ok) { this._scheduleNext(); return; }
            const d = await r.json();
            this.state = { ...this.state, ...d };
            if (d.status === 'done') {
              setTimeout(() => { if (d.result_deck_id) window.location.href = '/deck/' + d.result_deck_id; }, 1500);
              return;
            }
            if (d.status === 'error') return;
            this._scheduleNext();
          } catch(e) { this._scheduleNext(); }
        },
        _scheduleNext() { clearTimeout(this._timer); this._timer = setTimeout(() => this._poll(), 1500); }
      };
    }
  </script>
</body>
</html>
