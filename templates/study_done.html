{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto px-6 py-20 text-center">
  <div class="text-7xl mb-4">🎉</div>
  <h2 class="h-display text-4xl mb-2">{{ t('session_done') }}</h2>
  <p class="text-gray-600 mb-8">{{ total }} {{ t('cards_in_session') }}</p>
  <div class="grid grid-cols-2 gap-4 max-w-md mx-auto mb-8">
    <div class="glass rounded-2xl p-5">
      <div class="text-2xl font-bold text-emerald-600">{{ stats.good }}</div>
      <div class="text-xs text-gray-500">{{ t('good') }}</div>
    </div>
    <div class="glass rounded-2xl p-5">
      <div class="text-2xl font-bold text-orange-600">{{ stats.again }}</div>
      <div class="text-xs text-gray-500">{{ t('again') }}</div>
    </div>
  </div>
  <a href="/dashboard" class="btn btn-primary">{{ t('back_to_decks') }}</a>
</div>
{% endblock %}
