{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto px-6 py-16" x-data="{ mode: 'individual' }">
  <div class="text-center mb-8">
    <div class="text-5xl mb-4">🧠</div>
    <h1 class="h-display text-3xl">{{ t('register') }}</h1>
  </div>

  <!-- Tabs -->
  <div class="grid grid-cols-2 gap-2 mb-5 glass rounded-2xl p-2">
    <button @click="mode = 'individual'"
            :class="mode === 'individual' ? 'bg-blue-600 text-white' : 'text-gray-600 hover:bg-black/5'"
            class="rounded-xl py-2.5 font-medium text-sm transition">
      👤 Индивидуальный
    </button>
    <button @click="mode = 'corporate'"
            :class="mode === 'corporate' ? 'bg-blue-600 text-white' : 'text-gray-600 hover:bg-black/5'"
            class="rounded-xl py-2.5 font-medium text-sm transition">
      🏢 Учебный центр
    </button>
  </div>

  <form method="POST" class="glass rounded-2xl p-7 space-y-4">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <input type="hidden" name="mode" :value="mode">

    <div x-show="mode === 'corporate'" x-transition>
      <label class="text-sm text-gray-600 mb-1 block">Название организации</label>
      <input name="org_name" :required="mode === 'corporate'" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100" placeholder="ИДЕАЛ Учебный Центр">
      <p class="text-xs text-gray-500 mt-1">Вы будете администратором этой организации</p>
    </div>

    <div>
      <label class="text-sm text-gray-600 mb-1 block">{{ t('username') }}</label>
      <input name="username" required minlength="3" maxlength="32"
        pattern="[a-zA-Zа-яА-ЯёЁ0-9._-]{3,32}"
        title="3-32 символа: буквы (рус/eng), цифры, . _ -"
        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
      <p class="text-xs text-gray-500 mt-1">Можно русские и английские буквы, цифры, . _ -</p>
    </div>
    <div>
      <label class="text-sm text-gray-600 mb-1 block">{{ t('password') }}</label>
      <input type="password" name="password" required minlength="6"
        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
      <p class="text-xs text-gray-500 mt-1">Минимум 6 символов. Можно русские и английские буквы, цифры, символы.</p>
    </div>

    <button type="submit" class="btn btn-primary w-full justify-center">{{ t('register') }}</button>
    <p class="text-center text-sm text-gray-500">
      Уже есть аккаунт? <a href="/login" class="text-blue-600 hover:underline">{{ t('login') }}</a>
    </p>
  </form>
</div>
{% endblock %}
