{% extends "base.html" %}
{% block content %}
<div class="relative max-w-3xl mx-auto px-6 py-8" x-data="liveCreate()">
  <div class="deco-blob deco-blob-1" style="top:-50px; right:-100px;"></div>
  <div class="deco-blob deco-blob-2" style="bottom:200px; left:-100px;"></div>

  <div class="relative z-10">
    <div class="text-center mb-6">
      <span class="section-badge"><span class="badge-dot"></span>{{ t('lv_badge') }}</span>
      <h1 class="section-h" style="font-size: clamp(1.7rem, 3.5vw, 2.5rem); margin-top: 0.5rem;">{{ t('lv_h_create') }}</h1>
      <p class="text-slate-600 dark:text-slate-300 text-sm mt-2">{{ t('lv_sub_create') }}</p>
    </div>

  <form method="post" action="/live/create" class="glass-premium space-y-5">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <input type="hidden" name="mode" :value="mode">

    <!-- deck/category toggle -->
    <div>
      <label class="block text-sm font-bold text-slate-700 dark:text-slate-200 mb-2">{{ t('lv_source') }}</label>
      <div class="grid grid-cols-2 gap-2">
        <button type="button" @click="mode='deck'"
          :class="mode === 'deck' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white/70 dark:bg-slate-800/40 text-slate-700 dark:text-slate-200 border-gray-200 dark:border-slate-700'"
          class="p-3 rounded-xl border-2 font-bold transition">
          {{ t('lv_by_deck') }}
        </button>
        <button type="button" @click="mode='category'"
          :class="mode === 'category' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white/70 dark:bg-slate-800/40 text-slate-700 dark:text-slate-200 border-gray-200 dark:border-slate-700'"
          class="p-3 rounded-xl border-2 font-bold transition">
          {{ t('lv_by_cat') }}
        </button>
      </div>
    </div>

    <!-- Deck picker -->
    <div x-show="mode === 'deck'">
      <label class="block text-sm font-bold text-slate-700 dark:text-slate-200 mb-2">{{ t('lv_deck_lbl') }}</label>
      <div class="mb-2">
        <select x-model="categoryFilter" class="input">
          <option value="">{{ t('lv_all_cats') }}</option>
          <template x-for="c in categories" :key="c.id">
            <option :value="c.id" x-text="(c.parent_name ? c.parent_name + ' / ' : '') + (c.icon || '📁') + ' ' + c.name"></option>
          </template>
        </select>
      </div>
      <div class="space-y-2 max-h-72 overflow-y-auto pr-1">
        <template x-for="d in filteredDecks()" :key="d.id">
          <label class="flex items-center gap-3 p-3 rounded-xl border-2 cursor-pointer transition"
            :class="deckId === d.id ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/30' : 'border-gray-200 dark:border-slate-700 hover:border-indigo-300 bg-white/70 dark:bg-slate-800/40'">
            <input type="radio" name="deck_id" :value="d.id" x-model.number="deckId" class="hidden">
            <span class="text-2xl" x-text="d.icon || '📚'"></span>
            <div class="flex-1 min-w-0">
              <div class="font-semibold text-slate-900 dark:text-slate-100 truncate" x-text="d.name"></div>
              <div class="text-xs text-slate-500 dark:text-slate-400" x-text="d.cnt + ' {{ t('lv_cards_short') }}'"></div>
            </div>
            <span x-show="deckId === d.id" class="text-indigo-600 dark:text-indigo-300 text-xl">✓</span>
          </label>
        </template>
        <div x-show="filteredDecks().length === 0" class="text-center text-slate-500 dark:text-slate-400 italic py-4">
          {{ t('lv_no_decks') }}
        </div>
      </div>
    </div>

    <!-- Category picker -->
    <div x-show="mode === 'category'">
      <label class="block text-sm font-bold text-slate-700 dark:text-slate-200 mb-2">{{ t('lv_cat_lbl') }}</label>
      <div class="space-y-2 max-h-72 overflow-y-auto pr-1">
        <template x-for="c in categories" :key="c.id">
          <label class="flex items-center gap-3 p-3 rounded-xl border-2 cursor-pointer transition"
            :class="categoryId === c.id ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/30' : 'border-gray-200 dark:border-slate-700 hover:border-indigo-300 bg-white/70 dark:bg-slate-800/40'">
            <input type="radio" name="category_id" :value="c.id" x-model.number="categoryId" class="hidden">
            <span class="text-2xl" x-text="c.icon || '📁'"></span>
            <div class="flex-1 min-w-0">
              <div class="font-semibold text-slate-900 dark:text-slate-100 truncate"
                x-text="(c.parent_name ? c.parent_name + ' / ' : '') + c.name"></div>
            </div>
            <span x-show="categoryId === c.id" class="text-indigo-600 dark:text-indigo-300 text-xl">✓</span>
          </label>
        </template>
        <div x-show="categories.length === 0" class="text-center text-slate-500 dark:text-slate-400 italic py-4">
          {{ t('lv_no_cats') }}
        </div>
      </div>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-2">{{ t('lv_cat_hint') }}</p>
    </div>

    <!-- Host role -->
    <div>
      <label class="block text-sm font-bold text-slate-700 dark:text-slate-200 mb-2">{{ t('lv_role') }}</label>
      <div class="grid grid-cols-2 gap-3">
        <label class="flex flex-col items-center gap-2 p-4 rounded-xl border-2 cursor-pointer transition"
          :class="hostRole === 'observer' ? 'border-blue-500 bg-blue-50 dark:bg-blue-900/30' : 'border-gray-200 dark:border-slate-700 hover:border-blue-300 bg-white/70 dark:bg-slate-800/40'">
          <input type="radio" name="host_role" value="observer" x-model="hostRole" class="hidden">
          <span class="text-3xl">👁</span>
          <span class="font-semibold text-slate-900 dark:text-slate-100">{{ t('lv_observer') }}</span>
          <span class="text-xs text-slate-500 dark:text-slate-400 text-center">{{ t('lv_observer_sub') }}</span>
        </label>
        <label class="flex flex-col items-center gap-2 p-4 rounded-xl border-2 cursor-pointer transition"
          :class="hostRole === 'participant' ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-900/30' : 'border-gray-200 dark:border-slate-700 hover:border-emerald-300 bg-white/70 dark:bg-slate-800/40'">
          <input type="radio" name="host_role" value="participant" x-model="hostRole" class="hidden">
          <span class="text-3xl">🎮</span>
          <span class="font-semibold text-slate-900 dark:text-slate-100">{{ t('lv_participant') }}</span>
          <span class="text-xs text-slate-500 dark:text-slate-400 text-center">{{ t('lv_participant_sub') }}</span>
        </label>
      </div>
    </div>

    <!-- Number of questions -->
    <div>
      <label class="block text-sm font-bold text-slate-700 dark:text-slate-200 mb-2">{{ t('lv_q_count') }}</label>
      <div class="flex gap-2 flex-wrap">
        <template x-for="n in [5,10,15,20,30]" :key="n">
          <button type="button" @click="count = n"
            :class="count === n ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white/70 dark:bg-slate-800/40 text-slate-700 dark:text-slate-200 border-gray-200 dark:border-slate-700'"
            class="px-4 py-2 rounded-xl border-2 font-bold transition" x-text="n"></button>
        </template>
      </div>
      <input type="hidden" name="count" :value="count">
    </div>

    <!-- Time per question -->
    <div>
      <label class="block text-sm font-bold text-slate-700 dark:text-slate-200 mb-2">{{ t('lv_time_per_q') }}</label>
      <div class="flex gap-2 flex-wrap">
        <template x-for="t in [10,20,30,45,60]" :key="t">
          <button type="button" @click="timePerQ = t"
            :class="timePerQ === t ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white/70 dark:bg-slate-800/40 text-slate-700 dark:text-slate-200 border-gray-200 dark:border-slate-700'"
            class="px-4 py-2 rounded-xl border-2 font-bold transition" x-text="t + '{{ t('lv_time_unit') }}'"></button>
        </template>
      </div>
      <input type="hidden" name="time_per_q" :value="timePerQ">
    </div>

    <!-- Submit -->
    <button type="submit"
      :disabled="(mode === 'deck' && !deckId) || (mode === 'category' && !categoryId)"
      :class="((mode === 'deck' && !deckId) || (mode === 'category' && !categoryId)) ? 'opacity-40 cursor-not-allowed' : ''"
      class="btn-premium w-full justify-center" style="font-size: 17px; padding: 14px 28px;">
      {{ t('lv_create_btn') }}
    </button>
  </form>

  <div class="text-center mt-4">
    <a href="/live/history" class="text-sm text-indigo-600 dark:text-indigo-300 hover:underline font-semibold">{{ t('lv_history_link') }}</a>
  </div>
  </div>
</div>

<script>
function liveCreate() {
  const preselectCat = {{ preselect_category|tojson if preselect_category else 'null' }};
  return {
    decks: {{ decks|tojson }},
    categories: {{ categories|tojson }},
    mode: preselectCat ? 'category' : 'deck',
    deckId: null,
    categoryId: preselectCat,
    hostRole: 'observer',
    count: {{ preselect_count|tojson if preselect_count else 10 }},
    timePerQ: 20,
    categoryFilter: '',
    filteredDecks() {
      if (!this.categoryFilter) return this.decks;
      return this.decks.filter(d => String(d.category_id) === String(this.categoryFilter));
    }
  };
}
</script>
{% endblock %}
