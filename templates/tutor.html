{% extends "base.html" %}
{% block extra_head %}
<style>
  .tutor-msg { animation: fadeIn 0.3s ease-out; }
  .typing-dots span {
    display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: currentColor; margin: 0 1px;
    animation: typing 1.4s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { transform: scale(1); opacity: 0.5; }
    30% { transform: scale(1.2); opacity: 1; }
  }
  .markdown { white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
</style>
{% endblock %}
{% block content %}
<div class="relative max-w-5xl mx-auto px-4 py-6" x-data="tutorApp()" x-init="init()">
  <div class="deco-blob deco-blob-1" style="top:-50px; right:-100px;"></div>

  <div class="relative z-10">
    <div class="flex items-center justify-between mb-4 flex-wrap gap-3">
      <div>
        <span class="section-badge"><span class="badge-dot"></span>{{ t('tu_badge') }}</span>
        <h1 class="section-h" style="font-size: clamp(1.7rem, 3vw, 2.3rem); margin-top: 0.5rem;">{{ t('tu_h') }}</h1>
        <p class="text-sm text-slate-600 dark:text-slate-300 mt-1">{{ t('tu_sub') }}</p>
      </div>
      <button @click="clearHistory()" class="btn-premium-danger">{{ t('tu_clear') }}</button>
    </div>

    <div class="glass-premium flex flex-col" style="height: calc(100vh - 220px); min-height: 500px; padding: 0;">
      <div x-ref="msgs" class="flex-1 overflow-y-auto scrollbar p-5 space-y-4">
        <!-- Welcome -->
        <div x-show="messages.length === 0" class="text-center py-10">
          <div class="text-7xl mb-4">🤖</div>
          <h3 class="section-h" style="font-size: 1.5rem;">{{ t('tu_welcome_h') }}</h3>
          <p class="text-slate-600 dark:text-slate-300 max-w-md mx-auto text-sm mb-6 mt-2">
            {{ t('tu_welcome_sub') }}
          </p>
          <div class="flex flex-wrap gap-2 justify-center max-w-2xl mx-auto">
            <template x-for="s in suggestions" :key="s">
              <button @click="newMsg = s; send()" class="text-xs bg-white/70 dark:bg-slate-800/40 border border-indigo-200/50 dark:border-indigo-700/40 hover:border-indigo-400 hover:bg-indigo-50/50 dark:hover:bg-indigo-900/30 px-3 py-1.5 rounded-full transition font-semibold text-slate-700 dark:text-slate-200" x-text="s"></button>
            </template>
          </div>
        </div>

        <!-- Messages -->
        <template x-for="(m, i) in messages" :key="i">
          <div class="tutor-msg flex gap-3" :class="m.role === 'user' ? 'flex-row-reverse' : ''">
            <div class="flex-shrink-0 text-xl w-10 h-10 rounded-full flex items-center justify-center shadow-md"
              :class="m.role === 'user' ? 'bg-gradient-to-br from-indigo-500 to-purple-600 text-white' : 'bg-gradient-to-br from-amber-100 to-orange-100 dark:from-amber-900/40 dark:to-orange-900/40'">
              <span x-text="m.role === 'user' ? '👤' : '🤖'"></span>
            </div>
            <div class="max-w-[80%]">
              <div class="rounded-2xl p-4 markdown shadow-sm"
                :class="m.role === 'user' ? 'bg-gradient-to-r from-indigo-500 to-purple-600 text-white' : 'bg-white/80 dark:bg-slate-800/70 border border-amber-200/50 dark:border-amber-700/40 text-slate-800 dark:text-slate-100'"
                x-text="m.content"></div>
            </div>
          </div>
        </template>

        <!-- Typing -->
        <div x-show="loading" class="tutor-msg flex gap-3">
          <div class="flex-shrink-0 text-xl w-10 h-10 rounded-full flex items-center justify-center bg-gradient-to-br from-amber-100 to-orange-100 dark:from-amber-900/40 dark:to-orange-900/40">🤖</div>
          <div class="bg-white/80 dark:bg-slate-800/70 border border-amber-200/50 dark:border-amber-700/40 rounded-2xl p-4 typing-dots text-amber-600 dark:text-amber-300">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>

      <form @submit.prevent="send()" class="border-t border-slate-200/40 dark:border-slate-700/40 p-3 flex gap-2">
        <textarea x-model="newMsg" @keydown.enter.prevent="if (!$event.shiftKey) send()"
          rows="1" :disabled="loading"
          placeholder="{{ t('tu_input_ph') }}"
          class="input-premium" style="flex: 1; padding: 10px 14px; resize: none;"></textarea>
        <button type="submit" :disabled="!newMsg.trim() || loading"
          :class="(!newMsg.trim() || loading) ? 'opacity-40 cursor-not-allowed' : ''"
          class="btn-premium" style="padding: 10px 18px;">→</button>
      </form>
    </div>

    {% if not ai_available %}
    <div class="mt-4 glass-premium text-center text-sm text-amber-700 dark:text-amber-200" style="background: linear-gradient(135deg, rgba(245,158,11,0.15), rgba(255,255,255,0.85)); border-color: rgba(245,158,11,0.4); padding: 1rem;">
      {{ t('tu_unavail') }}
    </div>
    {% endif %}
  </div>
</div>

<script>
const TU_T = {
  clear_confirm: {{ t('tu_clear_confirm')|tojson }},
  error: {{ t('tu_error')|tojson }},
  net_error: {{ t('tu_net_error')|tojson }},
};
function tutorApp() {
  return {
    messages: [],
    newMsg: '',
    loading: false,
    suggestions: [
      {{ t('tu_sug_1')|tojson }},
      {{ t('tu_sug_2')|tojson }},
      {{ t('tu_sug_3')|tojson }},
      {{ t('tu_sug_4')|tojson }},
      {{ t('tu_sug_5')|tojson }},
    ],

    init() { this.scrollBottom(); },

    async send() {
      if (!this.newMsg.trim() || this.loading) return;
      const text = this.newMsg.trim();
      this.messages.push({ role: 'user', content: text });
      this.newMsg = '';
      this.loading = true;
      this.$nextTick(() => this.scrollBottom());
      try {
        const fd = new FormData();
        fd.append('message', text);
        const r = await fetch('/api/tutor/ask', { method: 'POST', body: fd });
        const data = await r.json();
        if (data.ok) {
          this.messages.push({ role: 'assistant', content: data.answer });
        } else {
          this.messages.push({ role: 'assistant', content: '⚠️ ' + (data.msg || TU_T.error) });
        }
      } catch (e) {
        this.messages.push({ role: 'assistant', content: TU_T.net_error });
      }
      this.loading = false;
      this.$nextTick(() => this.scrollBottom());
    },

    async clearHistory() {
      if (!confirm(TU_T.clear_confirm)) return;
      const fd = new FormData();
      await fetch('/api/tutor/clear', { method: 'POST', body: fd });
      this.messages = [];
    },

    scrollBottom() {
      const el = this.$refs.msgs;
      if (el) el.scrollTop = el.scrollHeight;
    }
  };
}
</script>
{% endblock %}
