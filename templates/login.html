{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto px-6 py-12" x-data="{ mode: 'individual' }">
  <div class="text-center mb-8">
    <div class="text-5xl mb-4">🧠</div>
    <h1 class="h-display text-3xl">Войти</h1>
  </div>

  {% if has_google %}
  <a href="/auth/google" class="btn btn-ghost w-full justify-center mb-3 text-sm border border-gray-200">
    <svg width="18" height="18" viewBox="0 0 18 18">
      <path fill="#EA4335" d="M9 3.48c1.69 0 2.85.73 3.5 1.34l2.55-2.49C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l2.91 2.26C4.6 5.05 6.62 3.48 9 3.48z"/>
      <path fill="#4285F4" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/>
      <path fill="#FBBC05" d="M3.88 10.78A5.54 5.54 0 0 1 3.58 9c0-.62.11-1.22.29-1.78L.96 4.96A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.04l2.92-2.26z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.4-1.57-5.12-3.74L.97 13.04C2.45 15.98 5.48 18 9 18z"/>
    </svg>
    Войти через Google
  </a>
  <div class="text-center text-xs text-gray-400 my-3">— или —</div>
  {% endif %}

  <div class="grid grid-cols-2 gap-2 mb-5 glass rounded-2xl p-2">
    <button @click="mode = 'individual'" :class="mode === 'individual' ? 'bg-blue-600 text-white' : 'text-gray-600 hover:bg-black/5'" class="rounded-xl py-2.5 font-medium text-sm transition">👤 Индивидуальный</button>
    <button @click="mode = 'corporate'" :class="mode === 'corporate' ? 'bg-blue-600 text-white' : 'text-gray-600 hover:bg-black/5'" class="rounded-xl py-2.5 font-medium text-sm transition">🏢 Учебный центр</button>
  </div>

  <form method="POST" class="glass rounded-2xl p-7 space-y-4">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <input type="hidden" name="mode" :value="mode">
    <div x-show="mode === 'corporate'" x-transition>
      <label class="text-sm text-gray-600 mb-1 block">Название организации</label>
      <input name="org_name" :required="mode === 'corporate'" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-blue-500">
    </div>
    <div>
      <label class="text-sm text-gray-600 mb-1 block">Username</label>
      <input name="username" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-blue-500">
    </div>
    <div>
      <label class="text-sm text-gray-600 mb-1 block">Пароль</label>
      <input type="password" name="password" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-blue-500">
    </div>
    <button type="submit" class="btn btn-primary w-full justify-center">Войти</button>
    <p class="text-center text-sm text-gray-500">Нет аккаунта? <a href="/register" class="text-blue-600">Зарегистрироваться</a></p>
  </form>
</div>
{% endblock %}
