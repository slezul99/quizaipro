{% extends "base.html" %}
{% block content %}
<div class="relative max-w-3xl mx-auto px-6 py-10">
  <div class="deco-blob deco-blob-1" style="top:-50px; right:-100px;"></div>
  <div class="deco-blob deco-blob-2" style="bottom:0; left:-150px;"></div>

  <div class="relative z-10">
    <div class="section-header left mb-8">
      <span class="section-badge"><span class="badge-dot"></span>⚙️ Профиль</span>
      <div class="section-divider-mini"><span class="line"></span><span class="star">✦</span><span class="line"></span></div>
      <h1 class="section-h">{{ t('settings_title') }}</h1>
      <p class="section-sub">{{ t('settings_subtitle') }}</p>
    </div>

    <form method="POST" class="space-y-5">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">

      <!-- Profile -->
      <div class="glass-premium">
        <h3 class="font-bold text-lg text-slate-900 dark:text-slate-100 mb-4 flex items-center gap-2">
          <span class="text-2xl">👤</span> {{ t('settings_profile') }}
        </h3>

        <div class="flex items-center gap-4 mb-5">
          <div class="w-20 h-20 rounded-full flex items-center justify-center text-white text-2xl font-bold flex-shrink-0 shadow-lg"
            :style="`background: ${avatarColor || 'linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899)'}`"
            x-data="{ get avatarColor() { return document.querySelector('input[name=avatar_color]').value; } }">
            {{ (user.full_name or user.username)[0]|upper }}
          </div>
          <div class="flex-1">
            <label class="text-xs uppercase tracking-wider font-bold text-slate-500 dark:text-slate-400 block mb-2">{{ t('settings_avatar_color') }}</label>
            <div class="flex gap-2 items-center">
              <input type="color" name="avatar_color" value="{{ user.avatar_color or '#6366f1' }}"
                class="w-14 h-12 rounded-xl cursor-pointer border-2 border-white shadow">
              <button type="button" onclick="document.querySelector('input[name=avatar_color]').value=''"
                class="text-xs text-slate-500 dark:text-slate-400 hover:underline font-semibold">{{ t('settings_reset_gradient') }}</button>
            </div>
          </div>
        </div>

        <label class="text-xs uppercase tracking-wider font-bold text-slate-500 dark:text-slate-400 block mb-2">{{ t('settings_full_name') }}</label>
        <input type="text" name="full_name" value="{{ user.full_name or '' }}" maxlength="60"
          placeholder="{{ t('settings_full_name_placeholder') }}" class="input-premium mb-4">

        <label class="text-xs uppercase tracking-wider font-bold text-slate-500 dark:text-slate-400 block mb-2">{{ t('settings_bio') }}</label>
        <textarea name="bio" rows="2" maxlength="200"
          placeholder="{{ t('settings_bio_placeholder') }}" class="input-premium" style="resize: vertical;">{{ user.bio or '' }}</textarea>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1.5">{{ t('settings_bio_limit') }}</p>
      </div>

      <!-- Privacy -->
      <div class="glass-premium">
        <h3 class="font-bold text-lg text-slate-900 dark:text-slate-100 mb-4 flex items-center gap-2">
          <span class="text-2xl">🔒</span> {{ t('settings_privacy') }}
        </h3>

        <label class="flex items-start gap-3 p-4 rounded-2xl bg-indigo-50/50 dark:bg-indigo-900/20 border border-indigo-200/40 dark:border-indigo-700/40 cursor-pointer hover:bg-indigo-50 dark:hover:bg-indigo-900/30 mb-3 transition">
          <input type="checkbox" name="profile_public" {% if user.profile_public %}checked{% endif %} class="w-5 h-5 mt-0.5 accent-indigo-600">
          <div class="flex-1">
            <div class="font-semibold text-slate-900 dark:text-slate-100">{{ t('settings_public_profile') }}</div>
            <div class="text-xs text-slate-600 dark:text-slate-300 mt-1">{{ t('settings_public_profile_desc') }}</div>
          </div>
        </label>

        <label class="flex items-start gap-3 p-4 rounded-2xl bg-indigo-50/50 dark:bg-indigo-900/20 border border-indigo-200/40 dark:border-indigo-700/40 cursor-pointer hover:bg-indigo-50 dark:hover:bg-indigo-900/30 mb-3 transition">
          <input type="checkbox" name="show_in_leaderboard" {% if user.show_in_leaderboard %}checked{% endif %} class="w-5 h-5 mt-0.5 accent-indigo-600">
          <div class="flex-1">
            <div class="font-semibold text-slate-900 dark:text-slate-100">{{ t('settings_show_leaderboard') }}</div>
            <div class="text-xs text-slate-600 dark:text-slate-300 mt-1">{{ t('settings_show_leaderboard_desc') }}</div>
          </div>
        </label>

        <label class="flex items-start gap-3 p-4 rounded-2xl bg-indigo-50/50 dark:bg-indigo-900/20 border border-indigo-200/40 dark:border-indigo-700/40 cursor-pointer hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition">
          <input type="checkbox" name="allow_friend_requests" {% if user.allow_friend_requests %}checked{% endif %} class="w-5 h-5 mt-0.5 accent-indigo-600">
          <div class="flex-1">
            <div class="font-semibold text-slate-900 dark:text-slate-100">{{ t('settings_allow_friends') }}</div>
            <div class="text-xs text-slate-600 dark:text-slate-300 mt-1">{{ t('settings_allow_friends_desc') }}</div>
          </div>
        </label>
      </div>

      <button type="submit" class="btn-premium w-full justify-center">
        ✓ {{ t('settings_save') }}
      </button>
    </form>
  </div>
</div>
{% endblock %}
