{% extends "base.html" %}
{% block content %}
<div class="relative max-w-md mx-auto px-6 py-20 text-center">
  <div class="deco-blob deco-blob-1" style="top:-50px; right:-50px;"></div>
  <div class="deco-blob deco-blob-3" style="bottom:0; left:-50px;"></div>

  <div class="relative z-10">
    <div class="text-8xl mb-5">🔒</div>
    <h2 class="section-h">{{ t('pv_h') }}</h2>
    <p class="text-slate-600 dark:text-slate-300 mb-6 mt-3">
      {{ t('pv_sub_pre') }}{{ target.username }} {{ t('pv_sub_post') }}
    </p>
    {% if target.allow_friend_requests %}
    <button onclick="sendRequest()" class="btn-premium">{{ t('pv_send_request') }}</button>
    {% endif %}
    <div class="mt-6">
      <a href="/leaderboard" class="text-indigo-600 dark:text-indigo-300 hover:underline text-sm font-semibold">{{ t('pv_back') }}</a>
    </div>
  </div>
</div>

{% if target.allow_friend_requests %}
<script>
const PV_T = {
  request_pre: {{ t('pv_request_sent_alert_pre')|tojson }},
  request_post: {{ t('pv_request_sent_alert_post')|tojson }},
  error: {{ t('pv_error')|tojson }},
};
async function sendRequest() {
  const fd = new FormData();
  fd.append('_csrf', '{{ csrf_token() }}');
  const r = await fetch('/friend/{{ target.username }}/request', { method: 'POST', body: fd });
  const data = await r.json();
  if (data.ok) {
    alert(PV_T.request_pre + '{{ target.username }} ' + PV_T.request_post);
  } else {
    alert(data.msg || PV_T.error);
  }
}
</script>
{% endif %}
{% endblock %}
