{% extends "base.html" %}
{% block content %}
<div class="relative max-w-md mx-auto px-6 py-20 text-center">
  <div class="deco-blob deco-blob-1" style="top:-50px; right:-50px;"></div>
  <div class="deco-blob deco-blob-3" style="bottom:0; left:-50px;"></div>

  <div class="relative z-10">
    <div class="text-8xl mb-5">🔒</div>
    <h2 class="section-h">Профиль скрыт</h2>
    <p class="text-slate-600 dark:text-slate-300 mb-6 mt-3">
      @{{ target.username }} не открывает свой профиль публично.
    </p>
    {% if target.allow_friend_requests %}
    <button onclick="sendRequest()" class="btn-premium">👋 Отправить запрос в друзья</button>
    {% endif %}
    <div class="mt-6">
      <a href="/leaderboard" class="text-indigo-600 dark:text-indigo-300 hover:underline text-sm font-semibold">← К лидерборду</a>
    </div>
  </div>
</div>

{% if target.allow_friend_requests %}
<script>
async function sendRequest() {
  const fd = new FormData();
  fd.append('_csrf', '{{ csrf_token() }}');
  const r = await fetch('/friend/{{ target.username }}/request', { method: 'POST', body: fd });
  const data = await r.json();
  if (data.ok) {
    alert('Запрос отправлен. Если @{{ target.username }} примет — сможете видеть его профиль.');
  } else {
    alert(data.msg || 'Ошибка');
  }
}
</script>
{% endif %}
{% endblock %}
