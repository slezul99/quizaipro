{% extends "base.html" %}
{% block content %}
<div class="relative max-w-5xl mx-auto px-6 py-10">
  <div class="deco-blob deco-blob-1" style="top:-50px; right:-100px;"></div>

  <div class="relative z-10">
    <div class="flex justify-between items-end mb-8 flex-wrap gap-3">
      <div class="section-header left" style="margin-bottom: 0;">
        <span class="section-badge"><span class="badge-dot"></span>📡 Каналы</span>
        <div class="section-divider-mini"><span class="line"></span><span class="star">✦</span><span class="line"></span></div>
        <h1 class="section-h">Каналы</h1>
      </div>
      <a href="/chats" class="btn-premium-ghost">← К чатам</a>
    </div>

    {% if channels %}
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      {% for c in channels %}
      <a href="/chat/{{ c.id }}" class="glass-premium block" style="padding: 1.25rem;">
        <div class="flex items-start gap-3 mb-2">
          <span class="text-4xl">{{ c.avatar }}</span>
          <div class="flex-1 min-w-0">
            <h3 class="font-bold text-slate-900 dark:text-slate-100 truncate">{{ c.name }}</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400">📡 Канал · {{ c.member_count }} подписчиков</p>
          </div>
        </div>
      </a>
      {% endfor %}
    </div>
    {% else %}
    <div class="text-center py-16 glass-premium">
      <div class="text-7xl mb-4">📡</div>
      <p class="text-slate-600 dark:text-slate-300">Пока нет публичных каналов</p>
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
