{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto px-6 py-20 text-center">
  <div class="text-7xl mb-4">🎮</div>
  <h1 class="h-display text-4xl mb-3 text-slate-900">Присоединиться к тесту</h1>
  <p class="text-slate-600 mb-8">Введите 6-значный код от учителя</p>

  <form method="POST" action="/live/join" class="glass rounded-3xl p-8">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <input name="code" required maxlength="6"
      placeholder="ABCD23"
      class="w-full px-4 py-5 rounded-2xl border-2 border-gray-200 focus:outline-none focus:border-indigo-500 bg-white text-3xl text-center font-bold tracking-widest uppercase font-mono"
      style="letter-spacing: 0.4em;"
      autofocus
      autocomplete="off">
    <button type="submit" class="btn btn-primary w-full justify-center mt-5 py-3 text-base">
      ▶ Войти
    </button>
  </form>

  <a href="/dashboard" class="text-indigo-600 text-sm hover:underline inline-block mt-6">← На главную</a>
</div>
{% endblock %}
